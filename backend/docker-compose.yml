services:

  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: comp-rounds-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128m
    security_opt:
      - apparmor:unconfined

  # ── API Server ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: comp-rounds-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_SECRET_KEY: ${API_SECRET_KEY}
      MATCH_HMAC_SECRET: ${MATCH_HMAC_SECRET}
      GLICKO2_TAU: ${GLICKO2_TAU}
      GLICKO2_PERIOD_HOURS: ${GLICKO2_PERIOD_HOURS}
      GLICKO2_DEFAULT_RATING: ${GLICKO2_DEFAULT_RATING}
      GLICKO2_DEFAULT_RD: ${GLICKO2_DEFAULT_RD}
      GLICKO2_DEFAULT_VOLATILITY: ${GLICKO2_DEFAULT_VOLATILITY}
    ports:
      - "${API_PORT:-8443}:8000"
    security_opt:
      - apparmor:unconfined

volumes:
  pgdata:
    driver: local
