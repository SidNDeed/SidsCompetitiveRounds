services:

  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: comp-rounds-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128m
    security_opt:
      - apparmor:unconfined

  # ── API Server ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: comp-rounds-api
    restart: unless-stopped
    # HARD REQUIREMENT: exactly ONE uvicorn worker. The API keeps live state
    # in process memory — the chat WebSocket registry (_ChatManager), the
    # presence dict (online counter), chat resend nonces, maintenance mode,
    # caches. With N workers each process gets its own copy: chat broadcasts
    # only reach sockets on the same worker (bug #52 — "messages don't
    # populate on other mod clients") and the online count splits per worker
    # (bug #51 — "says 1 online"). This command: overrides whatever CMD the
    # image's Dockerfile carries, so a stray --workers flag there can never
    # resurface those bugs. If the API ever needs more throughput, scale
    # verticals (asyncio handles this community's load easily) or move the
    # shared state to Redis FIRST.
    # --no-access-log: ~40 endpoints carry HMAC signatures as query params, so
    # uvicorn's access log recorded every sig verbatim, forever, in an
    # unrotated file (audit lower-pri item). App-level prints (the [TAG] lines)
    # are unaffected — they're where real diagnosis happens anyway.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # July 30: print() to a non-TTY stdout is BLOCK-buffered (~8KB), and with
      # --no-access-log the stream is quiet enough that diagnostic [TAG] lines
      # sat invisible for minutes-to-hours — a deploy verification chased a
      # "missing" log line that was sitting in the buffer. Every app-level
      # print flushes immediately with this set.
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_SECRET_KEY: ${API_SECRET_KEY}
      MATCH_HMAC_SECRET: ${MATCH_HMAC_SECRET}
      GLICKO2_TAU: ${GLICKO2_TAU}
      GLICKO2_DEFAULT_RATING: ${GLICKO2_DEFAULT_RATING}
      GLICKO2_DEFAULT_RD: ${GLICKO2_DEFAULT_RD}
      GLICKO2_DEFAULT_VOLATILITY: ${GLICKO2_DEFAULT_VOLATILITY}
      # Steam Web API key for /auth/steam ticket verification (July 21).
      # Empty default so the container starts with .env unchanged — unset =
      # pipeline no-op mode (tokens issued unverified, nothing enforced).
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      # Master soak switch: unset/empty = session enforcement is LOG-ONLY even
      # with the key set. Set STEAM_AUTH_ENFORCE=1 in .env once the logs show
      # ticket verification succeeding broadly, then restart the api container.
      STEAM_AUTH_ENFORCE: ${STEAM_AUTH_ENFORCE:-}
      # Security A2: admin HMAC secret — separate from the DLL-shipped
      # MATCH_HMAC_SECRET. Lives in .env; unset = every admin endpoint fails
      # closed (403), by design.
      ADMIN_HMAC_SECRET: ${ADMIN_HMAC_SECRET:-}
      # Read-replica role flag. THIS MAPPING IS REQUIRED, not decorative: this
      # project has no `env_file:`, so a key in .env reaches compose for
      # interpolation but NEVER reaches the container process unless it is
      # named here. Without this line the standby boots with replica mode
      # silently OFF while every log line and health check looks normal.
      # Rendered on the standby only (from scr_role); the primary's .env has no
      # such key, so `:-` yields an empty value there -- which main.py's value
      # check reads as PRIMARY. Never write SCR_REPLICA_MODE=0 into a .env:
      # os.getenv would return the string "0", which is truthy.
      SCR_REPLICA_MODE: ${SCR_REPLICA_MODE:-}
    volumes:
      # Bind-mount bug-report logs to the host so they survive container
      # rebuilds. Without this, every `docker compose up -d --build api`
      # nukes the writable layer and submitted log_filename rows orphan.
      - ./bug-reports:/opt/competitive-rounds/bug-reports
    ports:
      - "${API_PORT:-8443}:8000"
    security_opt:
      - apparmor:unconfined

  # ── Discord Bot ─────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: comp-rounds-bot
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PYTHONUNBUFFERED: "1"
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      API_BASE_URL: http://api:8000
      LEADERBOARD_CHANNEL: ${LEADERBOARD_CHANNEL}
      SERIES_LOG_CHANNEL: ${SERIES_LOG_CHANNEL}
      QUEUE_BEACON_CHANNEL: ${QUEUE_BEACON_CHANNEL}
      CHAT_CHANNEL: ${CHAT_CHANNEL:-1492022404829020230}
      RELEASES_CHANNEL: ${RELEASES_CHANNEL:-1498731888813277294}
      API_SECRET_KEY: ${API_SECRET_KEY}
      # FAQ auto-responder channel scoping (unset = global; see discord_bot.py)
      FAQ_CHANNEL_ALLOWLIST: ${FAQ_CHANNEL_ALLOWLIST:-}
      # §2.6 chat-split channel map "global:<id>,ru:<id>,es:<id>" (wave-2
      # find 22: the bot reads this but compose never passed it through —
      # an .env override silently did nothing). Unset = compiled defaults.
      CHAT_CHANNELS: ${CHAT_CHANNELS:-}
      # YouTube live-chat bridge (Aug 19, official liveChatMessages API —
      # chat_downloader 0.2.8 is parse-broken against current YouTube, see
      # the Dockerfile.bot tombstone). Values = the broadcast channel's OAuth
      # app + refresh token (same trio as the VM's youtube_title.json). Empty
      # defaults so the container starts pre-population; unset = the bridge
      # logs once and stays off (Twitch unaffected).
      YOUTUBE_BRIDGE_CLIENT_ID: ${YOUTUBE_BRIDGE_CLIENT_ID:-}
      YOUTUBE_BRIDGE_CLIENT_SECRET: ${YOUTUBE_BRIDGE_CLIENT_SECRET:-}
      YOUTUBE_BRIDGE_REFRESH_TOKEN: ${YOUTUBE_BRIDGE_REFRESH_TOKEN:-}
    volumes:
      # R2 f1: the YouTube chat quota ledger must survive container
      # rebuilds — Google's PT-day quota doesn't reset on redeploy, so an
      # in-memory ledger zeroed by a same-day `up -d --build` could
      # double-spend the day and starve the broadcast lifecycle calls.
      - ./bot-state:/opt/bot-state

volumes:
  pgdata:
    driver: local
