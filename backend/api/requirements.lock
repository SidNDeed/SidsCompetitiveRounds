# The api image's Python packages, locked by content. The Dockerfile installs
# ONLY this file, with --require-hashes and --only-binary=:all:, so pip refuses
# the build when any wheel it would install is not one of the files hashed
# here, and when the closure needs a package this file does not list.
#
# requirements.txt stays the human-edited list of what the api asks for; this
# file is its resolution for the image (CPython 3.12 on glibc x86_64): pip's
# resolver over requirements.txt, with environment markers evaluated for Linux
# (uvloop in, colorama out), each version pinned. Resolved 2026-10-06 (combat
# fix pass 8).
#
# EXACTLY ONE HASH PER PACKAGE: the SHA-256 of the one wheel the image's pip
# selects for that version on the image's platform (CPython 3.12, abi cp312,
# glibc 2.41, x86_64), so every other file of the same version -- another
# manylinux tag, a pure-Python wheel of a package that also ships a compiled
# one -- is refused by --require-hashes rather than installed. Chosen
# 2026-10-08 (combat fix pass 10): `pip download name==version --no-deps
# --only-binary=:all:` for that platform with no hash given, so pip's own tag
# ranking picks the file, then the SHA-256 of the downloaded file, checked
# against PyPI's record of it. The route-manifest gate refuses a package with
# any other number of hashes.
#
# To change a version: edit requirements.txt, resolve again the same way,
# choose the one wheel the same way, and expect the route manifest's digest to
# move (this file is in the build context, so it is in the digest).
