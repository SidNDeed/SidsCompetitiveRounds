# TLS front-end for the Competitive ROUNDS API.
#
# Serves HTTPS on 8444 and proxies to the api container over the compose
# network. Port 8443 is deliberately NOT handled here — uvicorn keeps serving
# it directly, in plaintext, so every already-installed client keeps working
# untouched while the HTTPS path is proven. Once MIN_MOD_VERSION is raised past
# the HTTPS release, drop the 8443 port-forward and this file is the only
# public entry point.
#
# Ports 80/443 belong to another device on the WAN IP, which is why this listens
# on 8444 and why the certificate is issued via a DNS-01 challenge (acme.sh +
# the DuckDNS TXT API) rather than HTTP-01/TLS-ALPN-01.

server {
    listen 8444 ssl;
    http2 on;
    server_name competitive-rounds.duckdns.org;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    # LOAD-BEARING: TLSv1.2 must stay. ROUNDS' Mono ClientWebSocket (in-game
    # chat) hardcodes SslProtocols.Tls|Tls11|Tls12 when it builds its SslStream
    # (verified by decompiling ROUNDS_Data/Managed/System.dll,
    # WebSocketHandle.ConnectAsyncCore) — it can NEVER negotiate TLS 1.3.
    # A routine "harden the config" pass that drops to TLSv1.3-only kills
    # in-game chat for every player while the REST API keeps working perfectly,
    # and nothing in the symptom points back to this line.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Bug-report bundles run 3.5-5 MB and the API's own hard cap is 16 MB
    # (_RL_MAX_BODY). nginx defaults to 1 MB, which would 413 every
    # log-attached report with a failure shape close to learning #100's 422.
    client_max_body_size 20m;

    # Don't advertise the version to scanners.
    server_tokens off;

    # No access log (Codex review find): ~40 endpoints carry HMAC signatures
    # as query parameters, and nginx's default combined format records the
    # full request line — the exact leak the uvicorn --no-access-log flag
    # closes on the direct path. App-level [TAG] prints carry all diagnosis.
    access_log off;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # LOAD-BEARING. uvicorn's rate limiter buckets on request.client.host
        # (main.py rate_limit_gate: 150 req/10s general, 20 req/10s on
        # /matches, /queue/join, /auth/steam, /shop/purchase, /bets). Without a
        # real per-client address here, every player collapses into ONE bucket
        # and the whole community 429s. Paired with uvicorn's
        # --proxy-headers --forwarded-allow-ips <this container's static IP>.
        #
        # Note this SETS rather than appends: a client-supplied X-Forwarded-For
        # must never be able to influence what the API sees.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;

        # Chat WebSocket (/api/v1/ws/chat). The client app-pings every 25s
        # (ChatClient.KeepAliveLoop) so nginx's 60s default would technically
        # survive, but the server never writes on an idle socket — give margin.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
